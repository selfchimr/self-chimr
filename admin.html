
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Gestion du Self CHIMR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
        main { max-width: 750px; margin: 0 auto; background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 5px; color: #0f172a; }
        .subtitle { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        .segmented { display: flex; background: #e2e8f0; padding: 4px; border-radius: 14px; margin-bottom: 24px; }
        .segmented label { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 700; color: #64748b; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .segmented input:checked + label { background: #0f172a; color: white; }
        .hidden { display: none !important; }
        .jour-bloc { border: 1px solid #e2e8f0; padding: 16px; border-radius: 14px; margin-bottom: 16px; background: #f8fafc; }
        .jour-header { margin-bottom: 12px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 8px; }
        .jour-titre { font-size: 15px; font-weight: 800; color: #0284c7; text-transform: capitalize; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .btn-sauvegarder { width: 100%; background: #0f172a; color: white; border: none; font-size: 14px; font-weight: 700; text-transform: uppercase; padding: 16px; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .date-semaine-titre { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 15px; text-align: center; background: #e0f2fe; padding: 8px; border-radius: 8px; }
        
        /* Styles Registre */
        .select-jour-registre { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-weight: 600; margin-bottom: 15px; background: #f8fafc; color: #0f172a; }
        .stats-grid { display: flex; gap: 10px; margin-bottom: 25px; }
        .stat-card { flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; text-align: center; }
        .stat-card .val { font-size: 20px; font-weight: 800; color: #0f172a; }
        .stat-card .lbl { font-size: 11px; color: #64748b; font-weight: 700; }
        .bloc-tableau { margin-bottom: 30px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; }
        .titre-tableau { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #0f172a; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #0f172a; display: flex; justify-content: space-between; }
        .titre-tableau .subtotal { font-size: 12px; color: #64748b; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 5px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 700; color: #475569; font-size: 12px; text-transform: uppercase; }
        .no-data { text-align: center; padding: 20px; color: #94a3b8; font-style: italic; font-size: 13px; }
        .btn-imprimer { width: 100%; background: #0284c7; color: white; border: none; font-size: 13px; font-weight: 700; text-transform: uppercase; padding: 14px; border-radius: 10px; cursor: pointer; margin-top: 10px; }

        /* --- OPTIMISATION SPÉCIFIQUE IMPRESSION --- */
        @media print {
            /* Masquer tout ce qui est inutile à l'impression */
            body > main > h1, 
            body > main > .subtitle, 
            body > main > .segmented, 
            #section-menus, 
            .btn-imprimer, 
            .select-jour-registre,
            .stats-grid { 
                display: none !important; 
            }

            /* Ajuster la largeur principale */
            main { 
                box-shadow: none; 
                width: 100%; 
                max-width: none; 
                padding: 0; 
            }

            /* Mettre le titre personnalisé pour l'impression */
            #section-registre::before { 
                content: "LISTE DES INSCRITS : " attr(data-date-print); 
                display: block; 
                font-size: 16px; 
                font-weight: 800; 
                margin-bottom: 10px; 
                border-bottom: 2px solid #000; 
            }

            /* Compacter les tableaux */
            .bloc-tableau { margin-bottom: 5px; }
            .titre-tableau { font-size: 11px; margin-bottom: 2px; }
            
            table { font-size: 10px !important; }
            th, td { padding: 2px 4px !important; }
            
            /* Forcer l'affichage côte à côte */
            #zone-tableaux { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 10px; 
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>🍳 Configuration & Suivi • Réseau Central</h1>
        <p class="subtitle">Gérez vos menus et consultez les inscriptions.</p>
        
        <div class="segmented">
            <input type="radio" id="tab-registre" name="onglet-admin" value="registre" class="hidden" checked onchange="basculerOnglet('registre')">
            <label for="tab-registre">📊 Liste cuisine</label>
            <input type="radio" id="tab-actuelle" name="onglet-admin" value="actuelle" class="hidden" onchange="basculerOnglet('actuelle')">
            <label for="tab-actuelle">📅 Semaine en cours</label>
            <input type="radio" id="tab-suivante" name="onglet-admin" value="suivante" class="hidden" onchange="basculerOnglet('suivante')">
            <label for="tab-suivante">⏩ Semaine suivante</label>
        </div>

        <div id="section-menus" class="hidden">
            <div id="titre-dates" class="date-semaine-titre">Chargement...</div>
            <form id="form-admin">
                <div id="conteneur-jours"></div>
                <button type="submit" class="btn-sauvegarder">🚀 Publier les menus</button>
            </form>
        </div>

        <div id="section-registre">
            <select id="select-jour" class="select-jour-registre" onchange="chargerInscriptionsDuJour()"></select>
            <div class="stats-grid">
                <div class="stat-card"><div id="total-a" class="val">0</div><div class="lbl">🍖 TOTAL MENU A</div></div>
                <div class="stat-card"><div id="total-b" class="val">0</div><div class="lbl">🌿 TOTAL MENU B</div></div>
            </div>
            <div id="zone-tableaux">
                <div class="bloc-tableau">
                    <div class="titre-tableau"><span>🍽️ Formule Sur Place</span><span id="sous-total-place" class="subtotal">0</span></div>
                    <table id="table-place"><tbody id="corps-place"></tbody></table>
                    <div id="vide-place" class="no-data">Aucun convive sur place.</div>
                </div>
                <div class="bloc-tableau">
                    <div class="titre-tableau"><span>🛍️ Formule À Emporter</span><span id="sous-total-emporter" class="subtotal">0</span></div>
                    <table id="table-emporter"><tbody id="corps-emporter"></tbody></table>
                    <div id="vide-emporter" class="no-data">Aucun paquet à emporter.</div>
                </div>
            </div>
            <button class="btn-imprimer" onclick="window.print()">🖨️ Imprimer le registre</button>
        </div>
    </main>
    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
        let semaineSelectionnee = "actuelle";
        let menusServeurComplets = {};

        function basculerOnglet(onglet) {
            document.getElementById('section-menus').classList.toggle('hidden', onglet === 'registre');
            document.getElementById('section-registre').classList.toggle('hidden', onglet !== 'registre');
            if (onglet === 'registre') {
                chargerInscriptionsDuJour();
            } else {
                semaineSelectionnee = onglet;
                genererInterfaceAdmin();
            }
        }

        function chargerBaseLundi(choix) {
            const maintenant = new Date();
            let jourSemaine = maintenant.getDay();
            if (jourSemaine === 0) jourSemaine = 7;
            let baseLundi = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate() - (jourSemaine - 1));
            if (choix === "suivante") baseLundi.setDate(baseLundi.getDate() + 7);
            return baseLundi;
        }

        function genererInterfaceAdmin() {
            const baseLundi = chargerBaseLundi(semaineSelectionnee);
            document.getElementById('titre-dates').textContent = `Semaine du Lundi ${baseLundi.getDate()}/${baseLundi.getMonth() + 1}/${baseLundi.getFullYear()}`;
            const conteneur = document.getElementById('conteneur-jours');
            conteneur.innerHTML = "";
            
            for (let i = 0; i < 5; i++) {
                let dateJour = new Date(baseLundi.getFullYear(), baseLundi.getMonth(), baseLundi.getDate() + i, 12, 0, 0);
                let isoClé = `${dateJour.getFullYear()}-${(dateJour.getMonth() + 1).toString().padStart(2, '0')}-${dateJour.getDate().toString().padStart(2, '0')}`;
                let menuJour = menusServeurComplets[isoClé] || { A: "", B: "" };
                
                const bloc = document.createElement('div');
                bloc.className = 'jour-bloc';
                bloc.innerHTML = `<div class="jour-header"><div class="jour-titre" data-date="${isoClé}">📅 ${dateJour.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
                    <div class="input-group"><label>🍖 Menu A</label><input type="text" id="a-${isoClé}" value="${menuJour.A || ''}"></div>
                    <div class="input-group"><label>🌿 Menu B</label><input type="text" id="b-${isoClé}" value="${menuJour.B || ''}"></div>`;
                conteneur.appendChild(bloc);
            }
        }

        function chargerInscriptionsDuJour() {
            const select = document.getElementById('select-jour');
            const jourSelectionne = select.value;
            document.getElementById('section-registre').setAttribute('data-date-print', select.options[select.selectedIndex].text);
            
            fetch(`${URL_SCRIPT_GOOGLE}?action=obtenirInscriptions`)
            .then(res => res.json())
            .then(toutesLesInscriptions => {
                let commandesDuJour = toutesLesInscriptions.filter(c => c.date === jourSelectionne);
                let listeCommandes = Array.from(new Map(commandesDuJour.map(c => [c.nom, c])).values());

                function construireTableau(list, idCorps, idTable, idVide, idSousTotal) {
                    const corps = document.getElementById(idCorps); 
                    corps.innerHTML = "";
                    if (list.length === 0) {
                        document.getElementById(idVide).style.display = "block";
                        document.getElementById(idTable).style.display = "none";
                        document.getElementById(idSousTotal).textContent = "0 repas";
                        return;
                    }
                    document.getElementById(idVide).style.display = "none";
                    document.getElementById(idTable).style.display = "table";
                    document.getElementById(idSousTotal).textContent = `${list.length} repas`;

                    ['Menu A', 'Menu B'].forEach(m => {
                        const items = list.filter(c => c.menu === m);
                        if (items.length > 0) {
                            let tr = document.createElement('tr');
                            let bgColor = (m === 'Menu A') ? '#fef3c7' : '#d1fae5';
                            let textColor = (m === 'Menu A') ? '#b45309' : '#047857';
                            tr.innerHTML = `<td colspan="3" style="background:${bgColor}; color:${textColor}; font-weight:800; font-size:12px; text-transform:uppercase; padding: 8px 12px;">
                                                ${m} (${items.length})
                                            </td>`;
                            corps.appendChild(tr);
                            items.forEach(cmd => {
                                let r = document.createElement('tr');
                                r.innerHTML = `<td>⬜</td><td><strong>${cmd.nom}</strong></td><td>${cmd.heure}</td>`;
                                corps.appendChild(r);
                            });
                        }
                    });
                }
                document.getElementById('total-a').textContent = listeCommandes.filter(c => c.menu === "Menu A").length;
                document.getElementById('total-b').textContent = listeCommandes.filter(c => c.menu === "Menu B").length;
                construireTableau(listeCommandes.filter(c => c.mode === "Sur place"), 'corps-place', 'table-place', 'vide-place', 'sous-total-place');
                construireTableau(listeCommandes.filter(c => c.mode === "À emporter"), 'corps-emporter', 'table-emporter', 'vide-emporter', 'sous-total-emporter');
            });
        }

        window.onload = () => {
            fetch(`${URL_SCRIPT_GOOGLE}?action=obtenirMenus`)
            .then(res => res.json())
            .then(donnees => { menusServeurComplets = donnees; });

            const select = document.getElementById('select-jour');
            const aujourdhui = new Date();
            for (let i = 0; i < 30; i++) {
                let d = new Date(aujourdhui.getFullYear(), aujourdhui.getMonth(), aujourdhui.getDate() + i);
                if (d.getDay() === 0 || d.getDay() === 6) continue;
                let opt = document.createElement('option');
                opt.value = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
                opt.textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
                select.appendChild(opt);
            }
            chargerInscriptionsDuJour();
        };

        document.getElementById('form-admin').addEventListener('submit', function(e) {
            e.preventDefault();
            let paquetsMenus = [];
            document.querySelectorAll('.jour-bloc').forEach(bloc => {
                let d = bloc.querySelector('.jour-titre').getAttribute('data-date');
                paquetsMenus.push({ date: d, menuA: bloc.querySelector(`input[id="a-${d}"]`).value, menuB: bloc.querySelector(`input[id="b-${d}"]`).value });
            });
            fetch(URL_SCRIPT_GOOGLE, { method: "POST", mode: "no-cors", body: new URLSearchParams({ action: "enregistrerMenus", donnees: JSON.stringify(paquetsMenus) }) }).then(() => alert("🎉 Publié !"));
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self CHIMR • Inscriptions</title>
</head>
<body>

    <form id="form-commande">
        <input type="text" id="nom_client" placeholder="Votre nom" required>
        <button type="submit" id="btn-submit">Confirmer la commande</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
            const form = document.getElementById('form-commande');

            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const btn = document.getElementById('btn-submit');
                    btn.disabled = true; 
                    btn.textContent = "Enregistrement en cours...";

                    // Assurez-vous que la variable dateSelectionneeISO est bien définie ailleurs dans votre code
                    const donnees = {
                        action: "enregistrerCommande",
                        date: typeof dateSelectionneeISO !== 'undefined' ? dateSelectionneeISO : new Date().toISOString().split('T')[0],
                        nom: document.getElementById('nom_client').value.trim(),
                        menu: document.querySelector('input[name="choix_menu"]:checked') ? document.querySelector('input[name="choix_menu"]:checked').value : "Non spécifié",
                        mode: document.querySelector('input[name="mode_retrait"]:checked') ? document.querySelector('input[name="mode_retrait"]:checked').value : "Non spécifié",
                        heure: document.getElementById('heure_retrait') ? document.getElementById('heure_retrait').value : "00:00"
                    };

                    fetch(URL_SCRIPT_GOOGLE, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: new URLSearchParams(donnees)
                    })
                    .then(() => {
                        alert("🎉 Réservation bien enregistrée !");
                        location.reload();
                    })
                    .catch(err => {
                        console.error("Erreur d'envoi:", err);
                        alert("Erreur lors de l'envoi. Veuillez réessayer.");
                        btn.disabled = false;
                        btn.textContent = "Confirmer la commande";
                    });
                });
            } else {
                console.error("L'élément form-commande n'a pas été trouvé.");
            }
        });
    </script>
</body>
</html>

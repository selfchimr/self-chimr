<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self CHIMR • Inscriptions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 40px; }
        header { background: white; padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo-title { font-size: 20px; font-weight: 800; color: #0f172a; }
        main { max-width: 450px; margin: 0 auto; padding: 16px; }
        h2 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 12px; padding-left: 4px; }
        
        .grid-jours { display: flex; justify-content: space-between; gap: 6px; width: 100%; }
        .btn-jour { flex: 1; height: 85px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; min-width: 0; }
        .btn-jour .j-nom { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        .btn-jour .j-num { font-size: 20px; font-weight: 800; color: #0f172a; margin-top: 2px; }
        .btn-jour .j-mois { font-size: 9px; font-weight: 600; color: #94a3b8; margin-top: 1px; }
        .btn-jour.bloque { background: #f1f5f9; border-color: #e2e8f0; opacity: 0.6; cursor: not-allowed; }
        .btn-jour.bloque .j-num { color: #94a3b8; }
        .btn-jour.bloque .j-mois { font-size: 8px; color: #ef4444; font-weight: 700; margin-top: 2px; text-transform: uppercase; }
        .btn-jour.actif { background: #0f172a; border-color: #0f172a; }
        .btn-jour.actif .j-nom { color: #cbd5e1; }
        .btn-jour.actif .j-num { color: white; }
        .btn-jour.actif .j-mois { color: #cbd5e1; }
        
        .hidden { display: none !important; }
        .space-form { margin-top: 24px; }
        
        .card-menu { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .card-menu .content { flex: 1; padding-right: 12px; display: flex; flex-direction: column; align-items: flex-start; }
        .card-menu .type-a { display: inline-block; font-size: 10px; font-weight: 800; color: #b45309; background: #fef3c7; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; text-transform: uppercase; }
        .card-menu .type-b { display: inline-block; font-size: 10px; font-weight: 800; color: #047857; background: #d1fae5; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; text-transform: uppercase; }
        .card-menu .plat-nom { font-size: 15px; font-weight: 700; color: #334155; line-height: 1.4; margin-bottom: 8px; }
        .card-menu .formule-fixe { font-size: 11px; font-style: italic; color: #64748b; font-weight: 500; }
        .card-menu .radio-custom { height: 20px; width: 20px; border: 2px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .card-menu .radio-custom::after { content: ""; width: 8px; height: 8px; background: white; border-radius: 50%; display: none; }
        
        .card-menu-input:checked + .card-menu.a { border-color: #f59e0b; background: rgba(254,243,199,0.15); }
        .card-menu-input:checked + .card-menu.a .radio-custom { border-color: #f59e0b; background: #f59e0b; }
        .card-menu-input:checked + .card-menu.a .radio-custom::after { display: block; }
        .card-menu-input:checked + .card-menu.b { border-color: #10b981; background: rgba(209,250,229,0.15); }
        .card-menu-input:checked + .card-menu.b .radio-custom { border-color: #10b981; background: #10b981; }
        .card-menu-input:checked + .card-menu.b .radio-custom::after { display: block; }
        
        .segmented { display: flex; background: #e2e8f0; padding: 3px; border-radius: 14px; margin-bottom: 20px; }
        .segmented label { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 700; color: #64748b; border-radius: 11px; cursor: pointer; }
        .segmented input:checked + label { background: white; color: #0f172a; }
        
        .bloc-info { background: white; border: 1px solid #e2e8f0; padding: 16px; border-radius: 20px; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 600; color: #334155; outline: none; }
        
        .btn-submit { width: 100%; background: #0f172a; color: white; border: none; font-size: 13px; font-weight: 700; text-transform: uppercase; padding: 16px; border-radius: 16px; cursor: pointer; }
        .chargement { text-align: center; padding: 30px; font-weight: 600; color: #64748b; }
    </style>
</head>
<body>

    <header>
        <div><h1 class="logo-title">Self CHIMR</h1></div>
    </header>

    <main>
        <div id="zone-chargement" class="chargement">🔄 Récupération des menus en cours...</div>
        
        <div id="app-contenu" class="hidden">
            <div style="margin-bottom: 20px;">
                <h2>📅 Prochains jours disponibles</h2>
                <div id="liste-jours" class="grid-jours"></div>
            </div>
            
            <form id="form-commande" class="hidden space-form">
                <div>
                    <h2>1. Sélectionnez votre assiette</h2>
                    <input type="radio" id="menuA" name="choix_menu" value="Menu A" class="card-menu-input hidden" required>
                    <label for="menuA" class="card-menu a">
                        <div class="content">
                            <span class="type-a">🍖 Menu A</span>
                            <span id="label-menu-a" class="plat-nom"></span>
                            <span class="formule-fixe">Entrée + Plat + Fromage + Dessert</span>
                        </div>
                        <div class="radio-custom"></div>
                    </label>
                    
                    <input type="radio" id="menuB" name="choix_menu" value="Menu B" class="card-menu-input hidden">
                    <label for="menuB" class="card-menu b">
                        <div class="content">
                            <span class="type-b">🌿 Menu B</span>
                            <span id="label-menu-b" class="plat-nom"></span>
                            <span class="formule-fixe">Entrée + Plat + Fromage + Dessert</span>
                        </div>
                        <div class="radio-custom"></div>
                    </label>
                </div>
                
                <div style="margin-top: 20px;">
                    <h2>2. Où mangez-vous ?</h2>
                    <div class="segmented">
                        <input type="radio" id="retrait-place" name="mode_retrait" value="Sur place" class="hidden" checked>
                        <label for="retrait-place">🍽️ Sur place</label>
                        <input type="radio" id="retrait-emporter" name="mode_retrait" value="À emporter" class="hidden">
                        <label for="retrait-emporter">🛍️ À emporter</label>
                    </div>
                </div>
                
                <div>
                    <h2>3. Finaliser la réservation</h2>
                    <div class="bloc-info">
                        <div class="input-group">
                            <label>Nom & Prénom</label>
                            <input type="text" id="nom_client" required placeholder="Votre nom complet">
                        </div>
                        <div class="input-group">
                            <label>Heure du retrait</label>
                            <select id="heure_retrait">
                                <option>12:00</option><option>12:15</option><option>12:30</option><option>12:45</option>
                                <option>13:00</option><option>13:15</option><option>13:30</option><option>13:45</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">Confirmer la commande</button>
            </form>
        </div>
    </main>

    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
        const JOURS_NOM = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
        const MOIS_FR = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
        let dateSelectionneeISO = "";
        let menusDuServeur = {};

        function chargerMenus() {
            fetch(URL_SCRIPT_GOOGLE + "?action=obtenirMenus")
            .then(res => res.json())
            .then(donnees => {
                menusDuServeur = donnees;
                document.getElementById('zone-chargement').classList.add('hidden');
                document.getElementById('app-contenu').classList.remove('hidden');
                genererCalendrier();
            })
            .catch(err => {
                document.getElementById('zone-chargement').innerHTML = "❌ Erreur de catalogue.";
            });
        }

            const conteneur = document.getElementById('liste-jours');

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self CHIMR • Inscriptions</title>
    <style>
        /* ... (Gardez le CSS que vous aviez dans index.html) ... */
    </style>
</head>
<body>
    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
        
        // ... (Gardez vos fonctions chargerMenus et genererCalendrier) ...

        // VOICI LA FONCTION D'ENREGISTREMENT CORRIGÉE
        document.getElementById('form-commande').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            btn.disabled = true; 
            btn.textContent = "Enregistrement en cours...";

            // On récupère les données
            const donnees = {
                action: "enregistrerCommande",
                date: dateSelectionneeISO,
                nom: document.getElementById('nom_client').value.trim(),
                menu: document.querySelector('input[name="choix_menu"]:checked').value,
                mode: document.querySelector('input[name="mode_retrait"]:checked').value,
                heure: document.getElementById('heure_retrait').value
            };

            // Envoi via fetch avec mode no-cors
            fetch(URL_SCRIPT_GOOGLE, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(donnees)
            })
            .then(() => {
                alert("🎉 Réservation bien enregistrée !");
                location.reload();
            })
            .catch(err => {
                console.error("Erreur d'envoi:", err);
                alert("Erreur lors de l'envoi. Veuillez réessayer.");
                btn.disabled = false;
                btn.textContent = "Confirmer la commande";
            });
        });
    </script>
</body>
</html>

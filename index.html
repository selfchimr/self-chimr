<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Self CHIMR • Inscriptions</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #form-commande { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; }
    </style>
</head>
<body>

    <h1>Inscription Self CHIMR</h1>

    <form id="form-commande">
        <label>Nom :</label>
        <input type="text" id="nom_client" required>
        
        <label>Menu :</label>
        <input type="radio" name="choix_menu" value="Menu A" checked> Menu A
        <input type="radio" name="choix_menu" value="Menu B"> Menu B
        
        <label>Mode :</label>
        <input type="radio" name="mode_retrait" value="Sur place" checked> Sur place
        <input type="radio" name="mode_retrait" value="À emporter"> À emporter
        
        <label>Heure :</label>
        <input type="time" id="heure_retrait" value="12:00">
        
        <button type="submit" id="btn-submit">Confirmer la commande</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcCFLxV_IxqN6zToLlGcCysRZKlbZWFYv2vla3vx8nSV2-BTzdubh9GLmIJ9XMVhjD/exec";
            const form = document.getElementById('form-commande');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('btn-submit');
                btn.disabled = true; 
                btn.textContent = "Enregistrement en cours...";

                const donnees = {
                    action: "enregistrerCommande",
                    date: new Date().toISOString().split('T')[0], // Date du jour
                    nom: document.getElementById('nom_client').value,
                    menu: document.querySelector('input[name="choix_menu"]:checked').value,
                    mode: document.querySelector('input[name="mode_retrait"]:checked').value,
                    heure: document.getElementById('heure_retrait').value
                };

                fetch(URL_SCRIPT_GOOGLE, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams(donnees)
                })
                .then(() => {
                    alert("🎉 Réservation enregistrée !");
                    location.reload();
                })
                .catch(err => {
                    alert("Erreur d'envoi.");
                    btn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
